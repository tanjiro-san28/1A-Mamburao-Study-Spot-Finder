 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mamburao Study Spot Finder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .login-card {
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0.5;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(1);
            }
        }
    </style>
</head>


<body class="min-h-screen bg-cover bg-center bg-fixed"
    style="
        background-image:
        linear-gradient(rgba(47, 81, 66, 0.45), rgba(0, 80, 45, 0.45)),
        url('background.png');


    <!-- =========================
         NAVIGATION BAR
    ========================== -->

    <nav class="bg-white shadow-sm">

        <div class="max-w-7xl mx-auto px-6 py-4">

            <div class="flex items-center justify-between">


                <!-- LOGO + WEBSITE NAME -->

                <div class="flex items-center gap-3">

                    <img
                        src="/Screenshot_20260915-193159~2.jpg"
                      alt="Mamburao Logo"
                      class="w-20 h-20 object-contain"
                      
                    >

                    <div>

                        <h1 class="text-xl font-bold text-white-700">
                            Mamburao Study Spot Finder
                        </h1>

                        <p class="text-xs text-white-500">
                            Find your perfect place to study
                        </p>

                    </div>

                </div>


                <!-- NAVIGATION -->

                <div class="hidden md:flex items-center gap-6">

                    <a
                        href="#"
                        class="text-gray-600 hover:text-green-600 transition">
                        Home
                    </a>

                    <a
                        href="#"
                        class="text-gray-600 hover:text-green-600 transition">
                        Study Spots
                    </a>

                    <a
                        href="#"
                        class="text-gray-600 hover:text-green-600 transition">
                        About
                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- =========================
         MAIN LOGIN SECTION
    ========================== -->

    <main
        class="min-h-[calc(100vh-81px)] flex items-center justify-center px-5 py-10">


        <!-- LOGIN CARD -->

        <div
            class="login-card bg-white w-full max-w-md rounded-2xl shadow-xl p-8">


            <!-- LOGO -->

            <div class="flex justify-center mb-5">

                <img
                    src="/Screenshot_20260915-193159~2.jpg"
                    alt="Mamburao"
                    class="w-24 h-24 object-contain"
                >

            </div>



            <!-- TITLE -->

            <div class="text-center mb-8">

                <h2 class="text-3xl font-bold text-gray-800">
                    Welcome Back!
                </h2>

                <p class="text-gray-500 mt-2">
                    Sign in to find your perfect study spot.
                </p>

            </div>



            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="mb-5">

                    <label
                        for="email"
                        class="block text-gray-700 font-semibold mb-2">

                        Email

                    </label>


                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email"
                        required

                        class="w-full px-4 py-3
                        border border-gray-300
                        rounded-lg

                        focus:outline-none
                        focus:ring-2
                        focus:ring-green-500
                        focus:border-green-500

                        transition"
                    >

                </div>



                <!-- PASSWORD -->

                <div class="mb-3">

                    <label
                        for="password"
                        class="block text-gray-700 font-semibold mb-2">

                        Password

                    </label>


                    <!-- PASSWORD CONTAINER -->

                    <div class="relative">


                        <input
                            id="password"
                            type="password"
                            placeholder="Enter your password"
                            required

                            class="w-full px-4 py-3 pr-12
                            border border-gray-300
                            rounded-lg

                            focus:outline-none
                            focus:ring-2
                            focus:ring-green-500
                            focus:border-green-500

                            transition"
                        >


                        <!-- SHOW PASSWORD BUTTON -->

                        <button
                            type="button"
                            onclick="togglePassword()"

                            class="absolute right-3 top-1/2
                            -translate-y-1/2
                            text-gray-500
                            hover:text-green-600">

                            👁

                        </button>

                    </div>

                </div>



                <!-- FORGOT PASSWORD -->

                <div class="text-right mb-6">

                    <a
                        href="#"
                        class="text-green-600
                        hover:text-green-700
                        hover:underline
                        text-sm
                        font-medium">

                        Forgot password?

                    </a>

                </div>



                <!-- SIGN IN BUTTON -->

                <button
                    type="submit"

                    class="w-full
                    bg-green-600
                    hover:bg-green-700
                    text-white
                    font-semibold
                    py-3
                    rounded-lg

                    shadow-md
                    hover:shadow-lg

                    transition
                    duration-200">

                    Sign In →

                </button>


            </form>



            <!-- =========================
                 DIVIDER
            ========================== -->

            <div class="flex items-center gap-3 my-7">

                <div class="h-px bg-gray-300 flex-1"></div>

                <span class="text-gray-400 text-sm">
                    OR
                </span>

                <div class="h-px bg-gray-300 flex-1"></div>

            </div>



            <!-- =========================
                 REGISTRATION
            ========================== -->

            <p class="text-center text-gray-600">

                Don't have an account?

                <a
                    href="Registration.html"

                    class="text-green-600
                    font-semibold
                    hover:text-green-700
                    hover:underline">

                    Sign up

                </a>

            </p>


        </div>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="text-center py-5 text-sm text-gray-500">

        © 2026 Mamburao Study Spot Finder

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        // SHOW / HIDE PASSWORD

        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }


        // LOGIN FORM

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert("Login system is not connected yet.");

            });

    </script>


</body>

</html>
</body>
</html>
