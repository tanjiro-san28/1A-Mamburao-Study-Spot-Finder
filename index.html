<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamburao Study Spot Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="hero">
    <div class="wrap nav-wrap">
      <nav>
        <div class="brand"><span class="lamp"></span>Mamburao Study Spot Finder</div>
        <div id="auth"><a href="Login.html">Log in</a></div>
      </nav>
    </div>
    <div class="wrap hero-body">
      <h1>Find a place to study when the power is out</h1>
      <p>Study spots in Mamburao with backup power, Wi-Fi, and hours you can check before you go.</p>
      <a class="cta" href="#spots">Find a spot</a>
      <div class="stat" id="stat"></div>
    </div>
  </header>

  <main class="wrap" id="spots">
    <div class="filters" role="group" aria-label="Filter study spots">
      <input type="search" id="search" placeholder="Search by name or note" aria-label="Search study spots">
      <select id="area" aria-label="Filter by area"><option value="">All areas</option></select>
      <button class="chip" data-filter="openNow" aria-pressed="false">Open now</button>
      <button class="chip" data-filter="backupPower" aria-pressed="false">Has backup power</button>
      <button class="chip" data-filter="openLate" aria-pressed="false">Open until 9 pm or later</button>
      <button class="chip" data-filter="wifi" aria-pressed="false">Wi-Fi</button>
      <button class="chip" data-filter="free" aria-pressed="false">Free</button>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <section class="grid" id="grid"></section>
  </main>

  <footer><div class="wrap">Power status changes. Confirm with the place before you go.</div></footer>

  <script src="index.js"></script>
<script src="modal.js"></script>
<script src="suggestion.js"></script>
</body>
</html>
